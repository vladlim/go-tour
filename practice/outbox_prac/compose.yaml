services:
  producer-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: producer
      POSTGRES_PASSWORD: producer
      POSTGRES_DB: producer
    ports: ["5432:5432"]
    volumes:
      - producer-data:/var/lib/postgresql/data
      - ./migrations/producer:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U producer -d producer"]
      interval: 2s
      timeout: 3s
      retries: 20

  consumer-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: consumer
      POSTGRES_PASSWORD: consumer
      POSTGRES_DB: consumer
    ports: ["5433:5432"]
    volumes:
      - consumer-data:/var/lib/postgresql/data
      - ./migrations/consumer:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consumer -d consumer"]
      interval: 2s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  producer:
    build:
      context: .
      args: { SERVICE: producer }
    environment:
      DATABASE_URL: postgres://producer:producer@producer-db:5432/producer?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: demo.events
      KAFKA_WRITE_TIMEOUT: 3s
      OUTBOX_POLL_INTERVAL: 1s
      OUTBOX_BATCH_SIZE: 20
    ports: ["8081:8081"]
    depends_on:
      producer-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  consumer:
    build:
      context: .
      args: { SERVICE: consumer }
    environment:
      DATABASE_URL: postgres://consumer:consumer@consumer-db:5432/consumer?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: demo.events
      KAFKA_GROUP_ID: event-processor
    depends_on:
      consumer-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  producer-data:
  consumer-data:
