name: outbox-practice

services:
  core-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core
    ports:
      - "5432:5432"
    volumes:
      - core-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core"]
      interval: 2s
      timeout: 3s
      retries: 20

  feed-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: feed
      POSTGRES_USER: feed
      POSTGRES_PASSWORD: feed
    ports:
      - "5433:5432"
    volumes:
      - feed-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feed -d feed"]
      interval: 2s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_started
    entrypoint: ["/bin/bash", "-ec"]
    # Array form is intentional: bash -c must receive the whole script as one argument.
    command:
      - >-
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1;
        do sleep 2; done;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic posts.events --partitions 3 --replication-factor 1
    restart: "no"

  core:
    build:
      context: .
      args:
        SERVICE: core
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://core:core@core-db:5432/core?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: posts.events
      OUTBOX_POLL_INTERVAL: 1s
      OUTBOX_BATCH_SIZE: 50
      OUTBOX_RETENTION: 168h
      IDEMPOTENCY_RETENTION: 24h
      CLEANUP_INTERVAL: 1h
      DEMO_CRASH_RELAY_ONCE: "false"
    ports:
      - "8080:8080"
    depends_on:
      core-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  feed:
    build:
      context: .
      args:
        SERVICE: feed
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://feed:feed@feed-db:5432/feed?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: posts.events
      KAFKA_GROUP_ID: feed-v1
      INBOX_RETENTION: 720h
      CLEANUP_INTERVAL: 1h
      DEMO_CRASH_CONSUMER_ONCE: "false"
    ports:
      - "8081:8080"
    depends_on:
      feed-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  core-db-data:
  feed-db-data:
